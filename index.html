<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>こえバトル</title>
<style>
:root{--bg:#14102e;--card:#241d52;--fg:#fff;--mut:#b8b0e8;--c1:#ff6b8b;--c2:#4dc3ff;--c3:#ffd23f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#3a2c86,var(--bg) 60%);color:var(--fg);font-family:"Hiragino Maru Gothic ProN","Meiryo",sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{margin:8px 0 2px;font-size:clamp(28px,5vw,44px);letter-spacing:.05em}
.sub{color:var(--mut);margin:0 0 14px;text-align:center}
main{width:100%;max-width:980px}
.panel{background:var(--card);border-radius:20px;padding:18px;margin-bottom:16px}
.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cbtn{border:4px solid transparent;border-radius:18px;padding:18px 6px;font-size:clamp(18px,3.4vw,28px);font-weight:bold;color:#fff;cursor:pointer;font-family:inherit;opacity:.65}
.cbtn.sel{opacity:1;border-color:#fff;transform:scale(1.04)}
.cbtn small{display:block;font-size:.55em;font-weight:normal;margin-top:4px}
.k0{background:var(--c1)}.k1{background:var(--c2)}.k2{background:var(--c3);color:#3a2c00}
#stage{text-align:center}
#big{font-size:clamp(48px,14vw,120px);font-weight:bold;min-height:1.2em;line-height:1.2}
#msg{color:var(--mut);min-height:1.5em}
.fx{position:relative;height:clamp(260px,46vh,420px);margin:6px 0;border-radius:16px;overflow:hidden;background:#0b0820}
#cv{position:absolute;inset:0;width:100%;height:100%}
#big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-shadow:0 0 18px #000,0 0 6px #000;pointer-events:none}
.sens{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}
.sens button{width:44px;height:44px;border-radius:50%;border:0;font-size:26px;font-weight:bold;background:#0006;color:#fff;cursor:pointer}
.sens b{min-width:7em}
.go{border:0;border-radius:40px;padding:16px 44px;font-size:clamp(22px,4vw,32px);font-weight:bold;background:#5dff8a;color:#06331a;cursor:pointer;font-family:inherit}
.go:disabled{opacity:.4}
.row{display:flex;align-items:center;gap:10px;margin:10px 0}
.row .nm{width:6.5em;font-weight:bold}
.bar{flex:1;height:40px;background:#0005;border-radius:10px;overflow:hidden}
.bar>div{height:100%;width:0;transition:width .8s;border-radius:10px}
.row .v{width:5.2em;text-align:right;font-weight:bold;font-size:1.2em}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 8px;text-align:left;border-bottom:1px solid #fff2}
button.sm{background:#0006;color:#fff;border:0;border-radius:8px;padding:4px 10px;cursor:pointer;font-family:inherit}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.hint{color:var(--mut);font-size:.85em}
</style>
</head>
<body>
<h1>🎤 こえバトル</h1>
<p class="sub">クラスをえらんで、こえを だそう！ ストップを おすまで はかります。 クラスの さいこうきろくで しょうぶ！</p>
<main>
 <div class="panel"><div class="classes" id="classes"></div></div>
 <div class="panel" id="stage">
  <div class="fx"><canvas id="cv"></canvas><div id="big">🎤</div></div>
  <div class="sens">かんど<button id="sm">−</button><b id="sv"></b><button id="sp">＋</button></div>
  <div id="msg">クラスを えらんで「スタート」を おしてね</div>
  <p><button class="go" id="go">スタート</button></p>
  <p class="hint">マイクの きょかを きかれたら「きょか」を おしてね。（かくにん用：スペースキーを おしている間は こえが でていることになります）</p>
 </div>
 <div class="panel">
  <h2 style="margin-top:0">🏆 クラス さいこうきろく</h2>
  <div id="rank"></div>
 </div>
 <div class="tools"><button class="sm" id="clrCls">このクラスの きろくを けす</button></div>
  <p class="hint">さいこうきろくだけ、この パソコン（ブラウザ）の中に ほぞんされます。</p>
</main>
<script>
const CLASSES=[{n:'5年1組',c:'#ff6b8b',k:'k0'},{n:'5年2組',c:'#4dc3ff',k:'k1'},{n:'6年',c:'#ffd23f',k:'k2'}];
let stopReq=false;
const SENS_MAX=15,REF_AMP=0.15,MARGIN_DB=4,KEY='koebattle.v3',DB_MIN=-60,DB_MAX=-15;
let sens=7,gateDb=-50;try{const g=localStorage.getItem('koebattle.sens');if(g!==null&&isFinite(+g))sens=Math.max(1,Math.min(SENS_MAX,+g))}catch(e){}
const ORB_PT=10; // ORB_PT: たま1こ＝10てん
const $=s=>document.querySelector(s);
let sel=0,busy=false,demo=false;
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!data||!Array.isArray(data.b)||data.b.length!==3)data={b:[0,0,0]}; // b:クラスごとのさいこうてん
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};

function renderClasses(){
  $('#classes').innerHTML=CLASSES.map((c,i)=>{
        return `<button class="cbtn ${c.k} ${i===sel?'sel':''}" data-i="${i}">${c.n}<small>${data.b[i]?'さいこう '+data.b[i]+'てん':'きろくなし'}</small></button>`}).join('');
  document.querySelectorAll('.cbtn').forEach(b=>b.onclick=()=>{if(busy)return;sel=+b.dataset.i;renderClasses();$('#msg').textContent=CLASSES[sel].n+' を えらびました'});
}
function renderRank(){
  const av=data.b.map(v=>v||null);
  const best=Math.max(...av.map(v=>v==null?-1:v)),top=Math.max(1,best);
  $('#rank').innerHTML=CLASSES.map((c,i)=>{
    const v=av[i];
    return `<div class="row"><div class="nm">${v!=null&&v===best?'👑':''}${c.n}</div>
    <div class="bar"><div style="width:${v==null?0:v/top*100}%;background:${c.c}"></div></div>
    <div class="v">${v==null?'―':Math.round(v)}</div></div>`}).join('');
}
function renderAll(){renderClasses();renderRank()}

// ---- audio ----
const A={ctx:null,an:null,buf:null,ready:false};
async function initMic(){
  if(A.ready){if(A.ctx.state==='suspended')await A.ctx.resume();return true}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    A.ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=A.ctx.createMediaStreamSource(st);
    A.an=A.ctx.createAnalyser();A.an.fftSize=2048;src.connect(A.an);
    A.buf=new Float32Array(A.an.fftSize);A.ready=true;return true;
  }catch(e){console.warn(e);return false}
}
// いまの こえの大きさを 0〜100 に
function dbNow(){
  A.an.getFloatTimeDomainData(A.buf);
  let s=0;for(const v of A.buf)s+=v*v;
  return 10*Math.log10(s/A.buf.length+1e-12);
}
// かんど：レベル1〜15（1つ上がるごとに 1.25ばい）
const mult=()=>0.25*Math.pow(1.25,sens-1);
function level(){
  if(demo)return 62+Math.random()*10;
  if(!A.ready)return 0;
  // まわりの おとより MARGIN_DB 大きい ぶんだけ ひろう
  // 音の大きさ（ふくらみ）に ひれいさせる：声が2ばいなら 点も ほぼ2ばい（上げんなし）
  const a=Math.pow(10,dbNow()/20)-Math.pow(10,gateDb/20);
  return Math.max(0,a/REF_AMP*100*mult());
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let live=0,cur=0,pts=0,orbs=[],orbAcc=0,orbOn=false;
// ---- かんど ----
function renderSens(){$('#sv').textContent='レベル '+sens+' / '+SENS_MAX}
function setSens(d){sens=Math.max(1,Math.min(SENS_MAX,sens+d));try{localStorage.setItem('koebattle.sens',sens)}catch(e){}renderSens()}
$('#sm').onclick=()=>setSens(-1);$('#sp').onclick=()=>setSens(1);renderSens();
// ---- どうしんえん ----
const cv=$('#cv'),g=cv.getContext('2d');let W=0,H=0,rings=[],hue=200,acc=0,lastT=performance.now();
function fit(){const d=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);fit();
function draw(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  const l=Math.min(1,cur/100),cx=W/2,cy=H/2,maxR=Math.hypot(W,H)/2;
  hue=(hue+dt*(40+l*200))%360;
  g.globalCompositeOperation='source-over';
  g.fillStyle='rgba(11,8,32,'+(.25+.3*(1-l))+')';g.fillRect(0,0,W,H);
  g.globalCompositeOperation='lighter';
  acc+=dt*(l>.03?4+l*40:0);
  while(acc>=1){acc-=1;rings.push({r:20+l*60,v:140+l*520,w:3+l*18,h:hue+Math.random()*60,a:.5+l*.5})}
  for(const o of rings){o.r+=o.v*dt;o.a-=dt*.5*(.6+o.r/maxR)}
  rings=rings.filter(o=>o.a>0&&o.r<maxR*1.1);
  for(const o of rings){g.strokeStyle=`hsla(${o.h},100%,50%,${Math.min(1,o.a)})`;g.lineWidth=o.w*.7;g.shadowColor=`hsl(${o.h},100%,60%)`;g.shadowBlur=20;g.beginPath();g.arc(cx,cy,o.r,0,7);g.stroke()}
  g.shadowBlur=0;
  const R=30+l*Math.min(W,H)*.32,gr=g.createRadialGradient(cx,cy,0,cx,cy,R);
  gr.addColorStop(0,`hsla(${hue},100%,85%,.95)`);gr.addColorStop(.5,`hsla(${hue+40},100%,60%,.5)`);gr.addColorStop(1,`hsla(${hue+80},100%,50%,0)`);
  g.fillStyle=gr;g.beginPath();g.arc(cx,cy,R,0,7);g.fill();
  // つみあがる たま
  if(orbOn){orbAcc=pts/ORB_PT;while(orbs.length<Math.floor(orbAcc)){orbs.push({x:Math.random()*W,y:-20,vy:0,tx:0,ty:0,h:(hue+orbs.length*7)%360,land:false})}}
  const n=orbs.length;let r=Math.min(22,Math.max(3,W/14)),cols,rows;
  for(;;){cols=Math.max(1,Math.floor(W/(2*r)));rows=Math.ceil(n/cols);if(rows*2*r<=H*.78||r<=3)break;r*=.93}
  orbs.forEach((o,i)=>{
    const row=Math.floor(i/cols),inRow=Math.min(cols,n-row*cols),c=i%cols;
    o.tx=W/2+(c-(inRow-1)/2)*2*r;o.ty=H-r-row*2*r;
    if(!o.land){o.vy+=dt*1800;o.y+=o.vy*dt;if(o.y>=o.ty){o.y=o.ty;o.land=true}o.x+=(o.tx-o.x)*Math.min(1,dt*8)}
    else{o.x+=(o.tx-o.x)*Math.min(1,dt*10);o.y+=(o.ty-o.y)*Math.min(1,dt*10)}
    const gr2=g.createRadialGradient(o.x-r*.3,o.y-r*.3,r*.1,o.x,o.y,r);
    gr2.addColorStop(0,`hsl(${o.h},100%,85%)`);gr2.addColorStop(1,`hsl(${o.h},90%,50%)`);
    g.globalCompositeOperation='source-over';g.fillStyle=gr2;g.beginPath();g.arc(o.x,o.y,r*.92,0,7);g.fill();
  });
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
(function loop(){
  if(!busy){live+=(level()-live)*.3;cur=live}
  requestAnimationFrame(loop);
})();

async function run(){
  if(busy)return;
  if(!(await initMic())){$('#msg').textContent='マイクが つかえません。ブラウザの マイクの きょかを たしかめてね';return}
  busy=true;$('#go').disabled=true;stopReq=false;
  // まわりの おとを はかる（この間は しずかに）
  let amb=-90;
  for(let n=3;n>=1;n--){$('#big').textContent=n;$('#msg').textContent=CLASSES[sel].n+'　しずかに… まわりの おとを はかっています';
    for(let k=0;k<24;k++){if(!demo)amb=Math.max(amb,dbNow());await sleep(33)}}
  if(!demo)gateDb=Math.max(-70,amb)+MARGIN_DB;
  $('#msg').textContent='こえを だして！！ おわったら「ストップ」';
  $('#go').textContent='ストップ';$('#go').style.background='#ff6b8b';$('#go').disabled=false;
  const t0=performance.now();let tp=t0,total=0;orbs=[];orbAcc=0;pts=0;orbOn=true;
  while(!stopReq){
    const now=performance.now(),l=level();cur=l;
    total+=l*(now-tp)/1000;tp=now;pts=total;
    $('#big').textContent=Math.floor(total)+'てん';
    await sleep(33);
  }
  $('#go').textContent='スタート';$('#go').style.background='';
  orbOn=false;const score=Math.round(total);
  const rec=score>data.b[sel];if(rec){data.b[sel]=score;save()}
  $('#big').textContent=score+'てん';
  $('#msg').textContent=CLASSES[sel].n+(rec?'：しんきろく！！ 🎉':'：きろくは こうしんされませんでした（さいこう '+data.b[sel]+'てん）');
  busy=false;renderAll();
}
$('#go').onclick=()=>{if(busy)stopReq=true;else run()};
$('#clrCls').onclick=()=>{if(busy)return;if(confirm(CLASSES[sel].n+'の きろくを ぜんぶ けしますか？')){data.b[sel]=0;save();renderAll()}};
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){demo=true;e.preventDefault()}});
addEventListener('keyup',e=>{if(e.code==='Space')demo=false});
renderAll();
</script>
</body>
</html>
